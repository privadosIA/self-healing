name: CI

# No branch filter: runs on every push and on pull requests.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint, tests, vulnerability scan and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The steps below run the same Makefile targets as a local checkout, with
      # the same pinned tool versions (staticcheck, govulncheck, gosec).
      - name: Lint (gofmt, go vet, staticcheck)
        run: make lint

      - name: Tests (race detector, coverage)
        run: make test

      - name: Vulnerability scan (govulncheck, gosec)
        run: make vuln

      - name: Build
        run: make build

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore
