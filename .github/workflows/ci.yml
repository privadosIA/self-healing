name: CI

# No branch filter: runs on every push and on pull requests.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint, tests, vulnerability scan and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      # The steps below run the same Makefile targets as a local checkout, with
      # the same pinned tool versions (staticcheck, govulncheck, gosec).
      - name: Lint (gofmt, go vet, staticcheck)
        run: make lint

      - name: Tests (race detector, coverage)
        run: make test

      - name: Vulnerability scan (govulncheck, gosec)
        run: make vuln

      - name: Build
        run: make build

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore
