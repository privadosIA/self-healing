# Example Docker Compose file for healerd. Copy it and adjust; every host below
# is a placeholder.
#
#   cp .env.example deploy/.env      # then edit: the secrets live there
#   docker compose -f deploy/docker-compose.example.yml up -d --build
#
# healerd speaks plain HTTP: put a TLS-terminating reverse proxy in front of it
# and do not publish the port on a public interface.

services:
  healerd:
    build:
      context: ..
    image: healerd:latest
    restart: unless-stopped

    # Bound to loopback on purpose; the reverse proxy forwards /webhook (and
    # /reports if you use Trivy) to it.
    ports:
      - "127.0.0.1:8080:8080"

    # Secrets and the rest of the configuration. See docs/configuration.md.
    env_file:
      - .env
    environment:
      HEALER_LISTEN_ADDR: ":8080"
      HEALER_DB_PATH: /data/healerd.db
      HEALER_ALLOWED_HOSTS: example.com
      HEALER_GITEA_URL: https://gitea.example.com
      HEALER_SONAR_URL: https://sonar.example.com
      HEALER_LLM_URL: http://llm.example.com/v1
      HEALER_LLM_MODEL: changeme
      # Secrets can also come from files instead of the environment:
      #   HEALER_GITEA_TOKEN_FILE: /run/secrets/gitea_token
    # secrets:
    #   - gitea_token

    volumes:
      - healerd-data:/data

    # The image runs as a non-root user; keep the container as locked down as
    # it can be. Clones go to /tmp, which is an in-memory tmpfs.
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s   # longer than HEALER_SHUTDOWN_GRACE

# secrets:
#   gitea_token:
#     file: ./secrets/gitea_token

volumes:
  healerd-data:
